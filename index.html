<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mastery Math | Belajar. Berlatih. Menguasai.</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<style>
:root{--p:#7C3AED;--b:#A855F7;--t:#C084FC;--y:#FFC93C;--bg:#F6F1FF;--tx:#2E1065;--mu:#6B6B8D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100%}
.m{mix-blend-mode:multiply;max-width:100%;height:auto;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.btn{border:0;border-radius:14px;padding:12px 20px;font:800 15px 'Nunito',system-ui,sans-serif;cursor:pointer;background:var(--p);color:#fff;transition:.15s;margin:3px 0}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px #7c3aed55}
.btn.o{background:#fff;color:var(--p);border:2px solid var(--p)}.btn.y{background:var(--y);color:#3b2f00}.btn.big{padding:15px 26px;font-size:16px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 16px #2f1f8b14}
.g{display:grid;gap:14px}.g1{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:10px;background:#e8e5ff;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--t));border-radius:9px;transition:width .6s}
.stat b{font-size:26px;display:block}.stat small,small{color:var(--mu)}
.say{display:flex;gap:12px;align-items:center}.say img{flex:none}.bub{background:#f1eeff;border-radius:16px;padding:12px 14px;font-weight:700}
.c{text-align:center}
.shell{display:flex;min-height:100vh}.side{width:220px;background:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex:none}
.lg{font-size:20px;font-weight:900;color:var(--p);padding:6px 10px 14px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:800;color:var(--mu)}.nav.on{background:var(--p);color:#fff}.nav:hover{background:#efecff}.nav.on:hover{background:var(--p)}
main{flex:1;padding:20px;min-width:0;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bell{position:relative;background:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px #0001}.bell i{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font:800 11px 'Nunito';border-radius:9px;padding:1px 6px}
.nd{position:absolute;right:0;top:52px;width:250px;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px #0003;z-index:20;font-size:14px;font-weight:700;text-align:left}.nd p{padding:6px 0}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px;white-space:nowrap}
.tag{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800;background:#ede9fe;color:#6D28D9;display:inline-block}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin:8px 0;border:2px solid #e3dfff;background:#fff;border-radius:14px;font:700 16px 'Nunito',system-ui,sans-serif;cursor:pointer;color:var(--tx)}.opt:hover{border-color:var(--p)}.opt.ok{background:#dcfce7;border-color:#22c55e}.opt.no{background:#fee2e2;border-color:#ef4444}
label{display:block;font-weight:800;font-size:13px;margin:8px 0}input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:2px solid #e3dfff;border-radius:10px;font:inherit;color:var(--tx);background:#fff}
.hero{background:linear-gradient(135deg,#4C1D95,#7C3AED 55%,#A855F7);color:#fff;padding:20px 24px 50px}.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.1;margin:10px 0}.hero p{font-size:18px;margin-bottom:20px;opacity:.95}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:center;max-width:1000px;margin:30px auto 0}.mp{background:#fff;border-radius:40px;padding:14px;text-align:center}.hero .btn.o.w{background:transparent;color:#fff;border-color:#fff}
.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:1000px;margin:-30px auto 30px;padding:0 16px}.pc{text-align:center;font-size:28px;transition:.2s}.pc:hover{transform:translateY(-6px)}.pc b{display:block;font-size:15px}
.rp{max-width:900px;margin:0 auto;padding:30px 16px}.rc{text-align:center;cursor:pointer;transition:.2s}.rc:hover{transform:translateY(-6px);box-shadow:0 12px 28px #7c3aed33}
.bd{text-align:center;font-size:40px}.bd.lk{filter:grayscale(1);opacity:.45}.bd b{display:block;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#2E1065;color:#fff;padding:10px 18px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;display:flex;gap:10px;align-items:center;z-index:50;max-width:92vw}#toast.s{opacity:1;transform:translate(-50%,0)}#toast img{border-radius:50%;background:#fff}
@media(max-width:800px){.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 -4px 16px #0002}.lg,.sw{display:none}.nav{flex-direction:column;flex:1;gap:2px;font-size:10px;padding:6px 2px;text-align:center}main{padding:14px 14px 100px}.say img{width:70px}}
input[type=checkbox]{width:auto;display:inline;margin:0 8px 0 0}details summary{cursor:pointer}@media print{.side,.top,.np,.hero{display:none!important}body{background:#fff}main{padding:0}}@media(max-width:800px){.side{overflow-x:auto}.nav{min-width:58px}}.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#fffffff2;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;box-shadow:0 2px 12px #4c1d9522}.lk a{margin:0 10px;font-weight:800;color:var(--p);cursor:pointer}.sec{max-width:1040px;margin:0 auto;padding:44px 16px}.sec h2{font-size:clamp(22px,4vw,32px);text-align:center;margin-bottom:6px}.sub{text-align:center;color:var(--mu);margin-bottom:22px}.chip{background:#ffffff26;color:#fff;border:1px solid #ffffff55;border-radius:99px;padding:5px 14px;font-weight:800;font-size:13px;display:inline-block;margin:3px 3px 3px 0}.num{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:8px}.ft{background:#2E1065;color:#fff;text-align:center;padding:30px 16px;line-height:1.7}@media(max-width:700px){.lk{display:none}}</style></head><body><div id="app"></div><div id="toast"></div><script>

// 1. FUNGSI DAFTAR MURID/GURU BARU (LANGSUNG DARI FORM WEBSITE ADMIN ANDA)
// =========================================================================
async function daftarUserBaru(emailInput, passwordInput, namaLengkap, statusRole, kelasInput) {
  try {
    // Membuat ID unik otomatis agar data tidak bentrok di server
    const customId = "user_" + Date.now();

    // Langsung mencatat ke database. Jalur ini 100% aman dari blokir browser di device lain!
    await database.ref('profiles/' + customId).set({
      id: customId,
      email: emailInput,
      password: passwordInput,
      nama: namaLengkap,
      role: statusRole,
      kelas: kelasInput || '',
      aktif: true
    });

    alert("Sukses Besar! Akun " + statusRole + " bernama " + namaLengkap + " berhasil didaftarkan langsung dari web Anda.");
    
    if(document.getElementById('inputEmailDaftar')) document.getElementById('inputEmailDaftar').value = '';
    if(document.getElementById('inputPasswordDaftar')) document.getElementById('inputPasswordDaftar').value = '';
    if(document.getElementById('inputNamaDaftar')) document.getElementById('inputNamaDaftar').value = '';

  } catch (error) {
    alert("Gagal mendaftarkan murid dari web: " + error.message);
  }
}

// =========================================================================
// 2. FUNGSI LOGIN UTAMA GLOBAL (LANGSUNG MENCOCOKKAN DATA DI MURID / HP LAIN)
// =========================================================================
async function loginUser(emailInput, passwordInput) {
  try {
    database.ref('profiles').once('value').then((snapshot) => {
      const allProfiles = snapshot.val();
      let akunDitemukan = null;

      if (allProfiles) {
        for (let id in allProfiles) {
          if (allProfiles[id].email === emailInput && allProfiles[id].password === passwordInput) {
            akunDitemukan = allProfiles[id];
            break;
          }
        }
      }

      if (akunDitemukan) {
        alert("Selamat datang kembali, " + akunDitemukan.nama + "!");
        
        if (akunDitemukan.role === 'guru') {
          alert("Membuka Dashboard Guru untuk memantau nilai...");
        } else if (akunDitemukan.role === 'siswa') {
          alert("Membuka lembar kuis Matematika Siswa...");
        }
        
        render(); 
      } else {
        alert("Gagal Masuk: Akun belum didaftarkan oleh Admin atau Password Anda salah!");
      }
    });

  } catch (error) {
    alert("Terjadi kendala koneksi internet saat mencoba masuk!");
  }
}
